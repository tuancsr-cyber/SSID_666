<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0072bc" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>VssID - Bảo hiểm xã hội số</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0072bc; /* Màu nền xanh của toàn trang vỏ */
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app-frame {
      width: 100%;
      max-width: 414px;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      background-color: #0072bc;
      
      /* 👉 ĐOẠN CODE NÀY QUYẾT ĐỊNH CHIỀU CAO VÙNG MÀU XANH PHÍA TRÊN */
      /* env(safe-area-inset-top) giúp tự động co giãn theo tai thỏ của điện thoại */
      /* Bạn có thể cộng thêm số px (ví dụ: + 20px) nếu muốn dải màu xanh cao hơn nữa */
      padding-top: calc(env(safe-area-inset-top, 0px) + 40px); 
    }
  </style>
</head>
<body>
  <iframe class="app-frame" src="https://script.google.com/macros/s/AKfycbzH9H9o59MZVIwovQkpUQJNWN51zt-YtGMiVnl9T2faUIzffqkjCvHlWEKXeXVFKAgo/exec"></iframe>
</body>
</html>
