<!DOCTYPE html>

<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0072bc" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>VssID - Bảo hiểm xã hội số</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0072bc;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start; /* Căn lề trên để dồn hết phần thừa xuống dưới và triệt tiêu */
    }
    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }
    /* Thanh màu xanh ở trên được tăng cao gấp 3 lần */
    .top-blue-banner {
      width: 100%;
      height: calc(env(safe-area-inset-top, 5px) + 50px);
      background-color: #0072bc;
      flex-shrink: 0;
    }
    .app-frame {
      width: 100%;
      flex: 1;
      border: none;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="top-blue-banner"></div>
    <iframe class="app-frame" src="https://script.google.com/macros/s/AKfycbzH9H9o59MZVIwovQkpUQJNWN51zt-YtGMiVnl9T2faUIzffqkjCvHlWEKXeXVFKAgo/exec"></iframe>
  </div>
</body>
</html>
