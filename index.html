<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0072bc" id="wrapper-meta-theme" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>VssID - Bảo hiểm xã hội số</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --vssid-primary: #0072bc;
      --vssid-header-start: #0082c8;
      --vssid-header-mid: #0066a6;
      --vssid-header-end: #005896;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* Thanh đệm tai thỏ trên cùng */
    .top-blue-banner {
      width: 100%;
      height: calc(env(safe-area-inset-top, 20px) + 10px);
      background-color: var(--vssid-primary);
      flex-shrink: 0;
      transition: background-color 0.15s ease;
    }

    /* Header dải màu chuẩn VssID */
    .vssid-header-gradient {
      background: linear-gradient(90deg, var(--vssid-header-start) 0%, var(--vssid-header-mid) 50%, var(--vssid-header-end) 100%);
    }

    /* Khung ứng dụng App Shell */
    .shell-layout {
      width: 100%;
      max-width: 430px;
      height: 100%;
      margin: 0 auto;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      body {
        background-color: #0f172a;
      }
      .shell-layout {
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }
    }

    /* Header Styles */
    .app-header {
      width: 100%;
      display: none;
      flex-shrink: 0;
    }
    .app-header.active {
      display: flex;
    }

    /* Bottom Nav Styles */
    .bottom-nav {
      width: 100%;
      display: none;
      flex-shrink: 0;
      background-color: #ffffff;
      border-top: 1px solid #e2e8f0;
      padding-top: 6px;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
      grid-template-columns: repeat(4, minmax(0, 1fr));
      text-align: center;
    }
    .bottom-nav.active {
      display: grid;
    }

    /* Iframe */
    .app-frame {
      width: 100%;
      flex: 1;
      border: none;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body class="w-full h-full select-none">

  <div class="shell-layout">

    <!-- 1. VÙNG TAI THỎ -->
    <div id="top-safe-banner" class="top-blue-banner"></div>

    <!-- 2. HEADER ĐIỀU HƯỚNG ĐỘNG -->
    <header id="wrapper-header" class="app-header">
      <!-- Mode Screen 2: Quản lý cá nhân -->
      <div id="header-mode-screen-2" class="hidden w-full vssid-header-gradient text-white px-4 py-3 items-center justify-between shadow-sm">
        <button type="button" onclick="sendLogoutToGas()" class="text-xl active:opacity-75 p-1">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1 class="text-[15px] font-medium tracking-wide uppercase">QUẢN LÝ CÁ NHÂN</h1>
        <button type="button" onclick="sendModalToGas()" class="relative text-xl flex items-center justify-center active:opacity-75 p-1">
          <span data-wrapper-icon="header_bell" class="inline-flex items-center justify-center">
            <i class="fa-solid fa-bell"></i>
          </span>
          <span class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">3</span>
        </button>
      </div>

      <!-- Mode Screen 3: Quá trình tham gia -->
      <div id="header-mode-screen-3" class="hidden w-full vssid-header-gradient text-white px-4 py-3 items-center justify-between shadow-sm">
        <button type="button" onclick="navigateGasScreen('screen-2')" class="text-xl pr-3 text-white active:opacity-75 flex items-center p-1">
          <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 320 512">
            <path d="M41.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 256 246.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/>
          </svg>
        </button>
        <h1 class="text-[15px] font-medium tracking-wide uppercase flex-1 text-center pr-5">QUÁ TRÌNH THAM GIA</h1>
      </div>

      <!-- Mode Screen 4: Chi tiết -->
      <div id="header-mode-screen-4" class="hidden w-full bg-white px-4 py-3 items-center justify-between border-b border-slate-100">
        <button type="button" onclick="navigateGasScreen('screen-3')" class="text-[#285989] text-xl pr-3 active:opacity-75 flex items-center p-1">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h1 class="text-[16px] font-bold text-[#285989] flex-1 text-center pr-5">Chi tiết</h1>
      </div>
    </header>

    <!-- 3. KHUNG IFRAME NỘI DUNG GAS -->
    <iframe
      id="gas-app-frame"
      class="app-frame"
      src="https://script.google.com/macros/s/AKfycbzH9H9o59MZVIwovQkpUQJNWN51zt-YtGMiVnl9T2faUIzffqkjCvHlWEKXeXVFKAgo/exec"
      allow="camera; microphone; fullscreen; clipboard-read; clipboard-write"
    ></iframe>

    <!-- 4. THANH ĐIỀU HƯỚNG DƯỚI CÙNG -->
    <nav id="wrapper-bottom-nav" class="bottom-nav">
      <button type="button" onclick="handleBottomNavPersonal()" class="flex flex-col items-center justify-center text-[var(--vssid-primary)] active:opacity-75">
        <span data-wrapper-icon="nav_ql_canhan" class="w-6 h-6 flex items-center justify-center">
          <i class="fa-solid fa-id-badge text-lg"></i>
        </span>
        <span class="text-[10.5px] mt-0.5 font-medium">QL cá nhân</span>
      </button>
      <button type="button" onclick="sendModalToGas()" class="flex flex-col items-center justify-center text-slate-400 active:opacity-75">
        <span data-wrapper-icon="nav_dichvu_cong" class="w-6 h-6 flex items-center justify-center">
          <i class="fa-regular fa-file-lines text-lg"></i>
        </span>
        <span class="text-[10.5px] mt-0.5">Dịch vụ công</span>
      </button>
      <button type="button" onclick="sendModalToGas()" class="flex flex-col items-center justify-center text-slate-400 active:opacity-75">
        <span data-wrapper-icon="nav_tra_cuu" class="w-6 h-6 flex items-center justify-center">
          <i class="fa-solid fa-magnifying-glass text-lg"></i>
        </span>
        <span class="text-[10.5px] mt-0.5">Tra cứu</span>
      </button>
      <button type="button" onclick="sendModalToGas()" class="flex flex-col items-center justify-center text-slate-400 active:opacity-75">
        <span data-wrapper-icon="nav_tro_giup" class="w-6 h-6 flex items-center justify-center">
          <i class="fa-solid fa-headset text-lg"></i>
        </span>
        <span class="text-[10.5px] mt-0.5">Trợ giúp</span>
      </button>
    </nav>

  </div>

  <script>
    let currentActiveScreen = 'screen-1';
    let wrapperUiConfig = { theme: {}, icons: {} };
    let cachedGasWindow = null;

    // Khôi phục cấu hình từ localStorage
    (function () {
      try {
        const saved = localStorage.getItem('VSSID_WRAPPER_UI_CONFIG');
        if (saved) applyWrapperUiConfig(JSON.parse(saved));
      } catch (e) {}
    })();

    function postToGasFrame(payload) {
      const frame = document.getElementById('gas-app-frame');
      if (frame) {
        try {
          if (cachedGasWindow && typeof cachedGasWindow.postMessage === 'function') {
            cachedGasWindow.postMessage(payload, '*');
            return;
          }
          if (frame.contentWindow) {
            frame.contentWindow.postMessage(payload, '*');
          }
        } catch (e) {}
      }
    }

    function navigateGasScreen(targetScreen) {
      updateShellLayout(targetScreen);
      postToGasFrame({ type: 'VSSID_NAVIGATE', targetScreen: targetScreen });
    }

    function handleBottomNavPersonal() {
      if (currentActiveScreen !== 'screen-2') {
        navigateGasScreen('screen-2');
      }
    }

    function sendLogoutToGas() {
      updateShellLayout('screen-1');
      postToGasFrame({ type: 'VSSID_LOGOUT' });
    }

    function sendModalToGas() {
      postToGasFrame({ type: 'VSSID_SHOW_MODAL', message: 'Lỗi kết nối đến hệ thống<br>Vui lòng thử lại' });
    }

    function updateShellLayout(screenId) {
      currentActiveScreen = screenId || 'screen-1';

      const headerWrapper = document.getElementById('wrapper-header');
      const m2 = document.getElementById('header-mode-screen-2');
      const m3 = document.getElementById('header-mode-screen-3');
      const m4 = document.getElementById('header-mode-screen-4');
      const bottomNav = document.getElementById('wrapper-bottom-nav');
      const topBanner = document.getElementById('top-safe-banner');
      const metaTheme = document.getElementById('wrapper-meta-theme');

      const t = (wrapperUiConfig && wrapperUiConfig.theme) || {};
      const primaryColor = t.primary || '#0072bc';
      const headerStart = t.headerStart || primaryColor;

      m2.classList.remove('flex'); m2.classList.add('hidden');
      m3.classList.remove('flex'); m3.classList.add('hidden');
      m4.classList.remove('flex'); m4.classList.add('hidden');

      if (currentActiveScreen === 'screen-1') {
        headerWrapper.classList.remove('active');
        bottomNav.classList.remove('active');
        topBanner.style.backgroundColor = primaryColor;
        if (metaTheme) metaTheme.setAttribute('content', primaryColor);
      } else if (currentActiveScreen === 'screen-2') {
        headerWrapper.classList.add('active');
        m2.classList.remove('hidden'); m2.classList.add('flex');
        bottomNav.classList.add('active');
        topBanner.style.backgroundColor = headerStart;
        if (metaTheme) metaTheme.setAttribute('content', headerStart);
      } else if (currentActiveScreen === 'screen-3') {
        headerWrapper.classList.add('active');
        m3.classList.remove('hidden'); m3.classList.add('flex');
        bottomNav.classList.add('active');
        topBanner.style.backgroundColor = headerStart;
        if (metaTheme) metaTheme.setAttribute('content', headerStart);
      } else if (currentActiveScreen === 'screen-4') {
        headerWrapper.classList.add('active');
        m4.classList.remove('hidden'); m4.classList.add('flex');
        bottomNav.classList.remove('active');
        topBanner.style.backgroundColor = '#ffffff';
        if (metaTheme) metaTheme.setAttribute('content', '#ffffff');
      }
    }

    function applyWrapperUiConfig(cfg) {
      if (!cfg || typeof cfg !== 'object') return;
      wrapperUiConfig = cfg;

      const t = cfg.theme || {};
      const root = document.documentElement;
      if (t.primary) root.style.setProperty('--vssid-primary', t.primary);
      if (t.headerStart) root.style.setProperty('--vssid-header-start', t.headerStart);
      if (t.headerMid) root.style.setProperty('--vssid-header-mid', t.headerMid);
      if (t.headerEnd) root.style.setProperty('--vssid-header-end', t.headerEnd);

      const icons = cfg.icons || {};
      document.querySelectorAll('[data-wrapper-icon]').forEach((el) => {
        const key = el.getAttribute('data-wrapper-icon');
        const iconData = icons[key];
        if (!iconData || !iconData.src) return;
        el.innerHTML = `<img src="${iconData.src}" alt="${key}" class="w-6 h-6 object-contain" />`;
      });

      updateShellLayout(currentActiveScreen);
    }

    // Lắng nghe postMessage từ Iframe bên trong xuyên qua 3 tầng Sandbox
    window.addEventListener('message', function (event) {
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (event.source) {
        cachedGasWindow = event.source;
      }

      if (data.type === 'VSSID_SCREEN_CHANGE') {
        updateShellLayout(data.screenId);
      } else if (data.type === 'VSSID_UI_CONFIG') {
        if (data.config) {
          try {
            localStorage.setItem('VSSID_WRAPPER_UI_CONFIG', JSON.stringify(data.config));
          } catch (e) {}
          applyWrapperUiConfig(data.config);
        }
      }
    });
  </script>
</body>
</html>
